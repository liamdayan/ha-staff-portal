<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/static/hr.css?v={{VERSION}}">
{{SCRIPTS}}
</head>
<body>
<header class="bar">
  <a class="brand" href="#/" id="brand"><img src="/icon.png" alt="" width="28" height="28"><span>{{TITLE}}</span></a>
  <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav" hidden>Menu</button>
</header>
<nav id="nav" class="nav" aria-label="HR portal" hidden></nav>
