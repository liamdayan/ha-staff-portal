name: Staff Portal
version: "0.12.23"
slug: staff_portal
description: Branded, locked-down staff app for phones and front desk computers, with per-role access to your devices.
arch:
  - aarch64
  - amd64
init: true
startup: application
boot: auto
# Just before Home Assistant backs the add-on up: put the database's write-ahead log back
# into the file (app/checkpoint.py).
backup_pre: python /app/checkpoint.py
# "Keep the HR key out of backups" (HR portal) keeps the HR key in this folder, which backups
# leave out; a locked copy that only the HR recovery key opens stays in the backup.
backup_exclude:
  - hr/outside-backups
  - hr/outside-backups/*
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:badge-account-horizontal
panel_title: Staff Access
panel_admin: true
ports:
  8787/tcp: 8787
  8788/tcp: 8788
ports_description:
  8787/tcp: Staff app (point your Cloudflare Tunnel at this port)
  8788/tcp: HR portal (point its own Cloudflare Tunnel hostname at this port)
