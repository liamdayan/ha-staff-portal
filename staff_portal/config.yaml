name: Staff Portal
version: "0.8.9"
slug: staff_portal
description: Branded, locked-down staff app for phones and front desk computers, with per-role access to your devices.
arch:
  - aarch64
  - amd64
init: true
startup: application
boot: auto
# Just before Home Assistant backs the add-on up: put the database's write-ahead log back
# into the file (app/checkpoint.py).
backup_pre: python /app/checkpoint.py
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:badge-account-horizontal
panel_title: Staff Access
panel_admin: true
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Staff app (point your Cloudflare Tunnel at this port)
